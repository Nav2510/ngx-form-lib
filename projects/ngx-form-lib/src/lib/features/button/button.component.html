@if (config) {
<div class="ngf-wrapper ngf-button-wrapper">
  <button
    mat-button
    [ngClass]="{
      'mat-button': config.attribute === ButtonAttribute.MatButton,
      'mat-flat-button': config.attribute === ButtonAttribute.MatFlatButton,
      'mat-raised-button': config.attribute === ButtonAttribute.MatRaisedButton,
      'mat-stroked-button':
        config.attribute === ButtonAttribute.MatStrokedButton,
      'mat-icon-button': config.attribute === ButtonAttribute.MatIconButton,
      'mat-fab': config.attribute === ButtonAttribute.MatFab,
      'mat-mini-fab': config.attribute === ButtonAttribute.MatMiniFab,
      'mat-fill': config.attribute === ButtonAttribute.MatFilledButton,
      'mat-outline': config.attribute === ButtonAttribute.MatOutlinedButton,
      'mat-text': config.attribute === ButtonAttribute.MatTextButton,
      'mat-elevated': config.attribute === ButtonAttribute.MatElevatedButton,
      'mat-tonal': config.attribute === ButtonAttribute.MatTonalButton
    }"
    [type]="config.subType"
    [color]="parentConfig | setParentConfig : config : 'color'"
  >
    @if (config.attribute === ButtonAttribute.MatIconButton || config.attribute
    === ButtonAttribute.MatFab || config.attribute ===
    ButtonAttribute.MatMiniFab) {
    <mat-icon>
      {{ config.label }}
    </mat-icon>
    } @else {
    {{ config.label }}
    }
  </button>
</div>
}
