@if (group && config) {
<div [formGroup]="group" class="ngf-wrapper ngf-radio-wrapper">
  @if (config.label) {
  <label [attr.for]="config.name">{{ config.label }}</label>
  }
  <mat-radio-group
    class="ngf-radio-group"
    [ngClass]="{ 'ngf-inline': config.showInline }"
    [formControlName]="config.name"
    [color]="parentConfig | setParentConfig : config : 'color'"
  >
    @for (option of config.options; track option.value) {
    <mat-radio-button class="ngf-radio-button" [value]="option.value">
      {{ option.label }}
    </mat-radio-button>
    }
  </mat-radio-group>
</div>
}
